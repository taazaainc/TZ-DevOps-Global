name: GitLeaks Secret Scanning
description: >
  Scans the commits of a pull request for secrets with Gitleaks. Latest push only on later pushes
  (whole PR when it is first opened or after a force-push), plus a check of the PR's net change.
  The Gitleaks version, config and ignore list are all central (this repo); nothing is read from the
  scanned repo. Fails closed when the tool cannot run. Block or warn is set with fail-on-secrets.

inputs:
  service-name:
    description: Service name, used in messages
    required: true
  fail-on-secrets:
    description: "'true' blocks the pipeline when secrets are found (default); 'false' only warns"
    required: false
    default: "true"
  gitleaks-version:
    description: DEPRECATED and ignored. The version comes from policy/tool-versions.env
    required: false
    default: ""
  config-file:
    description: DEPRECATED and ignored. A repo-local config would let a PR allowlist its own secrets
    required: false
    default: ""

outputs:
  secret-count:
    description: Number of potential secrets found
    value: ${{ steps.scan.outputs.secret_count }}

runs:
  using: composite
  steps:
    - name: Install gitleaks (per job, verified)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/install-tool.sh" gitleaks

    - name: Scan pull request
      id: scan
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_ACTION: ${{ github.event.action }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        MODE: ${{ inputs.fail-on-secrets == 'true' && 'block' || 'warn' }}
        SERVICE: ${{ inputs.service-name }}
        GH_TOKEN: ${{ github.token }}
      # GITHUB_ACTION_PATH / GITHUB_WORKSPACE are mapped into job containers; the ${{ github.* }} expressions are host paths
      run: |
        export CONFIG="$GITHUB_ACTION_PATH/.gitleaks.toml" POLICY_DIR="$GITHUB_ACTION_PATH/../../../policy/gitleaks" WORKSPACE="$GITHUB_WORKSPACE"
        bash "$GITHUB_ACTION_PATH/../../../scripts/gitleaks-pr-scan.sh"
