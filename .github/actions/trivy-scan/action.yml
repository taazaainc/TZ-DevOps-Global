name: Trivy Container Image Security Scan
description: >
  Scans a pre-built local Docker image with Trivy and fails closed. Always uses a fresh vulnerability
  database (the job fails if it cannot be updated or is too old). Blocks on fixable CRITICAL and HIGH
  vulnerabilities and on secrets baked into the image; also reports repo dependency vulnerabilities
  and configuration issues. The Trivy version, ignore list and settings are central (this repo);
  nothing is read from the scanned repo. Block or warn is set with fail-on-critical.

inputs:
  image-name:
    description: Full local image name including tag (use a tag that is unique per job)
    required: true
  service-name:
    description: Service name, used in messages
    required: true
  fail-on-critical:
    description: "'true' blocks the pipeline on findings (default); 'false' only warns. Name kept for compatibility"
    required: false
    default: "true"
  gate-severity:
    description: Comma-separated severities that block (fixable findings only)
    required: false
    default: "CRITICAL,HIGH"
  image-secrets:
    description: off | report | block  (secrets found inside the image layers; off by default, Gitleaks is the secret scanner)
    required: false
    default: "off"
  fs-scan:
    description: off | report | block  (dependency vulnerabilities from the repo's lock files)
    required: false
    default: "report"
  misconfig:
    description: off | report  (Dockerfile / Helm / Kubernetes configuration issues)
    required: false
    default: "report"
  scan-path:
    description: Folder inside the workspace for the repo scans (for example the service's context path)
    required: false
    default: "."
  max-db-age-hours:
    description: Fail if the vulnerability database is older than this
    required: false
    default: "48"
  # ---- deprecated, accepted and ignored so existing callers keep working ----
  severity:
    description: DEPRECATED and ignored (the gate uses gate-severity)
    required: false
    default: ""
  trivy-image:
    description: DEPRECATED and ignored (Trivy is installed per job from policy/tool-versions.env)
    required: false
    default: ""
  registry:
    description: DEPRECATED and ignored
    required: false
    default: ""
  registry-username:
    description: DEPRECATED and ignored
    required: false
    default: ""
  registry-password:
    description: DEPRECATED and ignored
    required: false
    default: ""

outputs:
  critical-count:
    description: Number of CRITICAL vulnerabilities found in the image (all, fixed or not)
    value: ${{ steps.scan.outputs.critical_count }}
  high-count:
    description: Number of HIGH vulnerabilities found in the image (all, fixed or not)
    value: ${{ steps.scan.outputs.high_count }}

runs:
  using: composite
  steps:
    - name: Install trivy (per job, verified)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/install-tool.sh" trivy

    - name: Scan image
      id: scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image-name }}
        SERVICE: ${{ inputs.service-name }}
        REPO: ${{ github.repository }}
        MODE: ${{ inputs.fail-on-critical == 'true' && 'block' || 'warn' }}
        GATE_SEVERITY: ${{ inputs.gate-severity }}
        IMAGE_SECRETS: ${{ inputs.image-secrets }}
        FS_SCAN: ${{ inputs.fs-scan }}
        MISCONFIG: ${{ inputs.misconfig }}
        SCAN_PATH: ${{ inputs.scan-path }}
        MAX_DB_AGE_HOURS: ${{ inputs.max-db-age-hours }}
      # GITHUB_ACTION_PATH / GITHUB_WORKSPACE are mapped into job containers; the ${{ github.* }} expressions are host paths
      run: |
        export POLICY_DIR="$GITHUB_ACTION_PATH/../../../policy/trivy" WORKSPACE="$GITHUB_WORKSPACE"
        bash "$GITHUB_ACTION_PATH/../../../scripts/trivy-scan.sh"
