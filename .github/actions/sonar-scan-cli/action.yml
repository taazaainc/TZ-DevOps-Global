name: SonarQube Scan (official scanner)
description: >
  Runs the Sonar analysis with the official SonarScanner CLI image, pinned by digest in
  policy/tool-versions.env. Works for JavaScript/TypeScript, Python, Go, PHP, Ruby, HTML/CSS and more,
  without a custom image per language. Picks up coverage reports automatically when tests produced them.
  Needs SONAR_TOKEN and SONAR_HOST_URL in the job environment. Run the quality gate action after it.

inputs:
  project-key:
    description: Sonar project key of the service
    required: true
  sources:
    description: Folder with the service source, relative to the repository root
    required: false
    default: "."
  project-version:
    description: Version label shown in Sonar
    required: false
    default: ""
  service-name:
    description: Service name, used in messages
    required: false
    default: ""
  host-workspace:
    description: Host path of the workspace (the workflow passes github.workspace); used for the docker mount
    required: true
  scanner-image:
    description: Optional override of the pinned scanner image (leave empty to use the central policy)
    required: false
    default: ""
  ignored-image:
    description: The old caller input sonar_nodejs_image; accepted for compatibility and only reported
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run Sonar analysis
      shell: bash
      env:
        PROJECT_KEY: ${{ inputs.project-key }}
        SOURCES: ${{ inputs.sources }}
        PROJECT_VERSION: ${{ inputs.project-version }}
        SERVICE: ${{ inputs.service-name }}
        HOST_WORKSPACE: ${{ inputs.host-workspace }}
        SCANNER_IMAGE: ${{ inputs.scanner-image }}
        IGNORED_IMAGE: ${{ inputs.ignored-image }}
      run: |
        # GITHUB_ACTION_PATH / GITHUB_WORKSPACE are mapped into job containers; the github.workspace expression is the host path
        export WORKSPACE="$GITHUB_WORKSPACE" POLICY_FILE="$GITHUB_ACTION_PATH/../../../policy/tool-versions.env"
        bash "$GITHUB_ACTION_PATH/../../../scripts/sonar-scan-cli.sh"
