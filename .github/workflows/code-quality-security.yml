name: Code Quality & Security

on:
  workflow_call:
    inputs:
      runner:
        description: >
          JSON array of runner labels, e.g. '["self-hosted","linux","your-runner-label"]'.
          Must match the self-hosted runner labels in the calling repository.
        required: false
        default: '["self-hosted"]'
        type: string
      changed_services:
        description: >
          JSON array of service objects to scan. Pass the output from check-for-changes.
          Example: '[{"name":"Assessment","sonar_key":"...","project_path":"..."}]'
          Pass '[]' or omit to skip scanning entirely.
        required: false
        default: '[]'
        type: string
      base_container_image:
        description: >
          Docker image for the job container (.NET scanning + Trivy builds).
          Must have dotnet SDK, sonar-scanner, docker CLI available.
          Must be an input (not secret) — GitHub disallows secrets context in
          container.image and in with: of reusable workflow calls.
          Store as a repo variable (vars.BASE_CONTAINER_IMAGE) in the caller.
        required: true
        type: string
      sonar_nodejs_image:
        description: >
          DEPRECATED, accepted but no longer used: Node.js/UI (and other non-.NET) services are scanned
          with the official SonarScanner CLI image pinned centrally in policy/tool-versions.env.
          Was: Docker image used to run SonarQube analysis for Node.js/UI services.
          Must be an input (not secret) — GitHub disallows secrets context in
          with: of reusable workflow calls.
          Store as a repo variable (vars.SONAR_NODEJS_IMAGE) in the caller.
          Optional — only required for repos with Node.js/UI services.
        required: false
        type: string
      sonar_java_image:
        description: >
          Docker image used to run SonarQube analysis for Java services.
          Must be an input (not secret) — GitHub disallows secrets context in
          with: of reusable workflow calls.
          Store as a repo variable (vars.SONAR_JAVA_IMAGE) in the caller.
          Optional — only required for repos with Java services.
        required: false
        type: string
      fail-on-critical:
        description: >
          Set to 'true' to fail the pipeline when Trivy finds CRITICAL vulnerabilities.
          Leave empty (default) — org-wide default 'true' is applied via the || operator in the step.
          Pass 'false' explicitly from a caller repo to bypass blocking for that repo only.
        required: false
        default: ""
        type: string
      fail-on-secrets:
        description: >
          Set to 'true' to fail the pipeline when GitLeaks detects secrets in source code.
          Leave empty (default) — org-wide default 'true' is applied via the || operator in the step.
          Pass 'false' explicitly from a caller repo to bypass blocking for that repo only.
        required: false
        default: ""
        type: string
    secrets:
      SONAR_TOKEN:
        description: SonarQube authentication token
        required: true
      SONAR_HOST_URL:
        description: SonarQube server URL
        required: true
      TCR_USERNAME:
        description: Container registry username
        required: true
      TCR_PASSWORD:
        description: Container registry password
        required: true
      PRE_BUILD_AWS_ACCESS_KEY_ID:
        description: >
          Optional AWS access key ID for pre-build scripts that need to download
          files from S3 (e.g. frontend environment files).
          Only required for repos that define pre_build_script in variables.json.
        required: false
      PRE_BUILD_AWS_SECRET_ACCESS_KEY:
        description: >
          Optional AWS secret access key for pre-build scripts that need to
          download files from S3.
          Only required for repos that define pre_build_script in variables.json.
        required: false
      NEXUS_USERNAME:
        description: >
          Nexus repository username for resolving private Maven dependencies.
          Only required for repos with Java services that pull from a private Nexus.
        required: false
      NEXUS_PASSWORD:
        description: >
          Nexus repository password for resolving private Maven dependencies.
          Only required for repos with Java services that pull from a private Nexus.
        required: false
    outputs:
      passed_services:
        description: >
          JSON array of service objects (same shape as the changed_services input)
          whose scan succeeded. Empty array '[]' if none passed, or if
          changed_services was empty. Does not change this workflow's own
          pass/fail result — a caller that only checks job success/failure
          (e.g. for merge-blocking) sees identical behavior to before this
          output existed. For callers that want to deploy whichever services
          passed even when the overall call reports failure (e.g. a PR where
          one service's scan fails shouldn't block every other service's dev
          deploy), consume this output directly instead of gating on
          needs.<job>.result.
        value: ${{ jobs.scan-summary.outputs.passed_services }}
      failed_services:
        description: >
          JSON array of service objects whose scan failed, or whose result
          could not be determined. Empty array '[]' if none failed.
        value: ${{ jobs.scan-summary.outputs.failed_services }}

jobs:
  code-quality-security:
    name: ${{ matrix.service.name }}-SCA & Security Scan
    runs-on: ${{ fromJson(inputs.runner) }}
    if: inputs.changed_services != '[]'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.changed_services) }}

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ matrix.service.sonar_key }}
      MAIN_PROJECT_PATH: ${{ matrix.service.project_path }}
      COMMON_LIB_PATHS: ${{ matrix.service.common_lib_paths }}
      DOTNET_VERSION: ${{ matrix.service.dotnet_version }}
      PROJECT_VERSION: "${{ github.head_ref }}-${{ github.run_number }}"
      GITHUB_WORKSPACE_DIR: ${{ github.workspace }}
      TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
      TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
      SONAR_NODEJS_IMAGE: ${{ inputs.sonar_nodejs_image }}
      SONAR_JAVA_IMAGE: ${{ inputs.sonar_java_image }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      # unique per repo run, attempt and matrix job: shared Docker daemons must never mix up scan images
      SCAN_IMAGE_TAG: scan-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}

    container:
      image: ${{ inputs.base_container_image }}
      options: >-
        --privileged
        -v /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ secrets.TCR_USERNAME }}
        password: ${{ secrets.TCR_PASSWORD }}

    steps:
      - name: Setup Docker permissions
        run: |
          if [ -S /var/run/docker.sock ]; then
            chmod 666 /var/run/docker.sock
          fi
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Environment
        run: |
          echo "=== Environment Check ==="
          echo "Service: ${{ matrix.service.name }}"
          echo "Project Path: $MAIN_PROJECT_PATH"
          echo ".NET Version: $DOTNET_VERSION"
          echo "SonarQube Project: $SONAR_PROJECT_KEY"
          echo ""
          echo "Available .NET SDKs:"
          dotnet --list-sdks
          echo ""
          echo "Installed Tools:"
          dotnet tool list --global
          echo ""
      # Starts the short result card shown in the job summary (one per service).
      - name: Prepare result card
        if: ${{ !cancelled() }}
        uses: taazaainc/TZ-DevOps-Global/.github/actions/scan-card@master
        with:
          mode: init
          service-name: ${{ matrix.service.name }}

      # Gitleaks runs FIRST, on the clean checkout (before the pre-build hook adds files) and whether or
      # not anything else has failed. Latest push on later pushes; whole PR when first opened.
      - name: GitLeaks Secret Scanning
        if: ${{ !cancelled() }}
        uses: taazaainc/TZ-DevOps-Global/.github/actions/gitleaks-scan@master
        with:
          service-name: ${{ matrix.service.name }}
          # Org-wide default is 'true' (block). A repo bypasses it only by passing fail-on-secrets: 'false'.
          fail-on-secrets: ${{ inputs.fail-on-secrets || 'true' }}
      - name: Run Pre-Build Hook
        if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PRE_BUILD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PRE_BUILD_AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          PRE_BUILD=$(jq -r '.pre_build_script // empty' <<< '${{ toJson(matrix.service) }}')
          if [ -n "$PRE_BUILD" ] && [ -f "$PRE_BUILD" ]; then
            echo "Running pre-build hook: $PRE_BUILD"
            bash "$PRE_BUILD"
          else
            echo "No pre_build_script defined -- skipping."
          fi
      - name: Docker Build for Trivy Scan
        if: ${{ !cancelled() }}
        id: build
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE_DIR
          export IMAGE_TAG="$SCAN_IMAGE_TAG"   # unique per repo, run, attempt and matrix job
          export IMAGE_NAME=${{ matrix.service.image_name }}

          echo "Building Docker image: $IMAGE_NAME:$IMAGE_TAG"

          # Construct build command with arguments
          BUILD_CMD="docker build -t $IMAGE_NAME:$IMAGE_TAG"
          BUILD_CMD="$BUILD_CMD -f ${{ matrix.service.dockerfile }}"

          # Add build arguments if they exist
          if jq -e '.build_args' <<< '${{ toJson(matrix.service) }}' > /dev/null 2>&1; then
            for key in $(jq -r '.build_args[]' <<< '${{ toJson(matrix.service) }}'); do
              value=$(jq -r --arg k "$key" '.build_arg_values[$k].qa // .build_arg_values[$k].dev // ""' <<< '${{ toJson(matrix.service) }}')
              if [ -n "$value" ]; then
                BUILD_CMD="$BUILD_CMD --build-arg $key=\"$value\""
              fi
            done
          fi

          BUILD_CMD="$BUILD_CMD ${{ matrix.service.context_path }}"

          echo "Executing: $BUILD_CMD"
          eval "$BUILD_CMD"
      # Trivy runs after the build and whether or not Gitleaks/earlier steps failed. Sonar comes after it,
      # so a Sonar failure can never hide a security result.
      - name: Trivy Security Scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: taazaainc/TZ-DevOps-Global/.github/actions/trivy-scan@master
        with:
          image-name: ${{ matrix.service.image_name }}:${{ env.SCAN_IMAGE_TAG }}
          service-name: ${{ matrix.service.name }}
          scan-path: ${{ matrix.service.context_path || '.' }}
          # Org-wide default is 'true' (block). A repo bypasses it only by passing fail-on-critical: 'false'.
          fail-on-critical: ${{ inputs.fail-on-critical || 'true' }}
      - name: Post-Build Cleanup
        if: always()
        env:
          PHASE: cleanup
        shell: bash
        run: |
          PRE_BUILD=$(jq -r '.pre_build_script // empty' <<< '${{ toJson(matrix.service) }}')
          if [ -n "$PRE_BUILD" ] && [ -f "$PRE_BUILD" ]; then
            bash "$PRE_BUILD"
          else
            echo "No pre_build_script defined -- skipping cleanup."
          fi
      # .NET Service Scanning (all services except UI with scanner_type: 'nodejs')
      # Marks the start of the Sonar work, so the quality gate check only accepts a report written after it.
      - name: Mark Sonar start
        if: ${{ !cancelled() }}
        run: touch "$RUNNER_TEMP/sonar-start"

      - name: Add Missing Test Packages
        id: dn_pkgs
        if: ${{ !cancelled() && (!matrix.service.scanner_type) }}
        run: bash /scripts/add-missing-packages.sh
      - name: Run SonarQube Build, Test & Analysis
        id: dn_run
        if: ${{ !cancelled() && (!matrix.service.scanner_type) && steps.dn_pkgs.outcome == 'success' }}
        run: bash /scripts/dotnet-build-test-sonarqube.sh
      - name: SonarQube Quality Gate Check
        id: dn_gate
        if: ${{ !cancelled() && (!matrix.service.scanner_type) && steps.dn_run.outcome == 'success' }}
        uses: taazaainc/TZ-DevOps-Global/.github/actions/sonar-quality-gate@master
        with:
          project-key: ${{ matrix.service.sonar_key }}
          service-name: ${{ matrix.service.name }}
          # waits for THIS analysis to finish (not a fixed sleep) and reads the gate of that analysis

      # Sonar for non-.NET services, with the official SonarScanner CLI image pinned in policy/tool-versions.env.
      # Language independent (JS/TS, Python, Go, PHP, Ruby, ...); coverage reports are picked up when present.
      # The caller's sonar_nodejs_image input is still accepted but no longer used (callers stay unchanged).
      - name: SonarQube Scan for Node.js/UI
        id: node_scan
        if: ${{ !cancelled() && contains(fromJson('["nodejs","generic","python","go"]'), matrix.service.scanner_type) }}
        uses: taazaainc/TZ-DevOps-Global/.github/actions/sonar-scan-cli@master
        with:
          project-key: ${{ matrix.service.sonar_key }}
          sources: ${{ matrix.service.project_path }}
          project-version: ${{ github.head_ref || github.ref_name }}-${{ github.run_number }}
          service-name: ${{ matrix.service.name }}
          host-workspace: ${{ github.workspace }}
          ignored-image: ${{ inputs.sonar_nodejs_image }}
      - name: SonarQube Quality Gate Check (Node.js)
        id: node_gate
        if: ${{ !cancelled() && steps.node_scan.outcome == 'success' }}
        uses: taazaainc/TZ-DevOps-Global/.github/actions/sonar-quality-gate@master
        with:
          project-key: ${{ matrix.service.sonar_key }}
          service-name: ${{ matrix.service.name }}
          # waits for THIS analysis to finish (not a fixed sleep) and reads the gate of that analysis

      - name: Pull Java SonarQube Image
        id: java_pull
        if: ${{ !cancelled() && (matrix.service.scanner_type == 'java') }}
        run: |
          JAVA_IMAGE=$(printf '%s' "$SONAR_JAVA_IMAGE" | tr -d '[:space:]')
          echo "Pulling image: $JAVA_IMAGE"
          docker pull "$JAVA_IMAGE"
      - name: SonarQube Scan for Java
        id: java_scan
        if: ${{ !cancelled() && (matrix.service.scanner_type == 'java') && steps.java_pull.outcome == 'success' }}
        run: |
          JAVA_IMAGE=$(printf '%s' "$SONAR_JAVA_IMAGE" | tr -d '[:space:]')
          docker run --rm \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -e NEXUS_USERNAME="$NEXUS_USERNAME" \
            -e NEXUS_PASSWORD="$NEXUS_PASSWORD" \
            -e SONAR_PROJECT_KEY="${{ matrix.service.sonar_key }}" \
            -e SONAR_SOURCES="$MAIN_PROJECT_PATH" \
            -e SONAR_PROJECT_VERSION="${{ github.head_ref || github.ref_name }}-${{ github.run_number }}" \
            -v "${{ github.workspace }}:/usr/src" \
            "$JAVA_IMAGE"
      - name: SonarQube Quality Gate Check (Java)
        id: java_gate
        if: ${{ !cancelled() && (matrix.service.scanner_type == 'java') && steps.java_scan.outcome == 'success' }}
        uses: taazaainc/TZ-DevOps-Global/.github/actions/sonar-quality-gate@master
        with:
          project-key: ${{ matrix.service.sonar_key }}
          service-name: ${{ matrix.service.name }}
          # waits for THIS analysis to finish (not a fixed sleep) and reads the gate of that analysis

      # Publishes the card: one status per check, then what to fix. Runs even when a check failed.
      - name: Publish result card
        if: always()
        uses: taazaainc/TZ-DevOps-Global/.github/actions/scan-card@master
        with:
          mode: publish
          service-name: ${{ matrix.service.name }}

      - name: Cleanup Docker Images
        if: always()
        run: |
          IMAGE_TAG="$SCAN_IMAGE_TAG"
          IMAGE_NAME=${{ matrix.service.image_name }}

          echo "Cleaning up images for this job only..."
          docker rmi "${IMAGE_NAME}:${IMAGE_TAG}" 2>/dev/null || echo "Image ${IMAGE_NAME}:${IMAGE_TAG} already removed"

          echo "Cleanup complete"
      - name: Cleanup root-owned workspace artifacts
        if: always()
        run: |
          # This step runs inside the container (as root), so it can remove root-owned
          # bin/obj/TestResults directories left by dotnet build/test.
          # Without this, the next job's actions/checkout@v4 (which runs as the bare runner user)
          # will fail with EACCES when git clean tries to delete these root-owned files.
          echo "Removing root-owned build artifacts from workspace..."
          find "$GITHUB_WORKSPACE" -name "bin" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -name "obj" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -name "TestResults" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Workspace artifact cleanup complete"
      - name: Cleanup home package caches
        if: always()
        run: |
          # Runs inside the container as root — safe to clean $HOME which maps to
          # _work/_temp/_github_home on the host runner. Without this, NuGet/.dotnet/
          # .local caches accumulate across runs (9-11G per runner instance).
          #
          # Intentionally KEPT (do not remove):
          #   $HOME/.cache/trivy  — Trivy vuln DB (~4G), avoids re-download every run
          #   $HOME/.sonar        — SonarQube scanner cache, speeds up analysis
          #
          # Safe because: each runner instance has its own _github_home, parallel
          # matrix jobs run on separate instances, no downstream step reads these caches.
          echo "Clearing package manager caches from container home..."
          rm -rf "$HOME/.nuget"     2>/dev/null || true
          rm -rf "$HOME/.dotnet"    2>/dev/null || true
          rm -rf "$HOME/.local"     2>/dev/null || true
          rm -rf "$HOME/.pub-cache" 2>/dev/null || true
          rm -rf "$HOME/.m2"        2>/dev/null || true
          rm -rf "$HOME/.npm"       2>/dev/null || true
          echo "✅ Home caches cleared (trivy DB and sonar cache preserved)"

  scan-summary:
    name: Scan Summary
    runs-on: ${{ fromJson(inputs.runner) }}
    needs: [code-quality-security]
    if: always()
    outputs:
      passed_services: ${{ steps.summarize.outputs.passed_services }}
      failed_services: ${{ steps.summarize.outputs.failed_services }}
    steps:
      - name: Report scan results
        id: summarize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT="${{ needs.code-quality-security.result }}"
          SERVICES='${{ inputs.changed_services }}'

          echo "=================================================="
          echo "           CODE QUALITY & SECURITY SUMMARY        "
          echo "=================================================="
          echo ""

          if [ "$RESULT" = "skipped" ]; then
            echo "⏭️  No services changed — scan skipped."
            echo ""
            echo "Result: SKIPPED (no changed services detected)"
            echo "passed_services=[]" >> $GITHUB_OUTPUT
            echo "failed_services=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Parse service names from the JSON input
          SERVICE_NAMES=$(echo "$SERVICES" | jq -r '.[].name' 2>/dev/null || echo "")

          if [ "$RESULT" = "success" ]; then
            echo "✅ All scanned services PASSED"
            echo ""
            echo "Services scanned:"
            while IFS= read -r svc; do
              [ -n "$svc" ] && echo "  ✅ $svc"
            done <<< "$SERVICE_NAMES"
            echo ""
            echo "Result: ALL PASSED — merge is allowed."
            echo "passed_services<<EOF" >> $GITHUB_OUTPUT
            echo "$SERVICES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "failed_services=[]" >> $GITHUB_OUTPUT
            exit 0
          elif [ "$RESULT" = "failure" ]; then
            echo "❌ One or more service scans FAILED"
            echo ""

            # Query this run's jobs via API to get per-job conclusions
            RUN_JOBS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              | jq -r '.jobs[] | "\(.name)|\(.conclusion)"' 2>/dev/null || echo "")

            PASSED_NAMES=""
            FAILED_NAMES=""
            echo "Services scanned:"
            while IFS= read -r svc; do
              if [ -z "$svc" ]; then continue; fi
              # Job name format from API: "code-quality-security / <ServiceName>-SCA & Security Scan"
              JOB_CONCLUSION=$(echo "$RUN_JOBS" | grep "/ ${svc}-SCA" | cut -d'|' -f2)
              if [ "$JOB_CONCLUSION" = "success" ]; then
                echo "  ✅ $svc"
                PASSED_NAMES="${PASSED_NAMES}${svc}"$'\n'
              elif [ "$JOB_CONCLUSION" = "failure" ]; then
                echo "  ❌ $svc"
                FAILED_NAMES="${FAILED_NAMES}${svc}"$'\n'
              else
                echo "  ⚠️  $svc"
                FAILED_NAMES="${FAILED_NAMES}${svc}"$'\n'
              fi
            done <<< "$SERVICE_NAMES"
            echo ""
            echo "Result: FAILED — merge is blocked. Fix the failing service scan(s) above."

            # Project the full service objects (not just names) so a caller's
            # build-deploy matrix can consume this directly, same shape as
            # changed_services.
            PASSED_JSON=$(jq -c --argjson all "$SERVICES" --arg names "$PASSED_NAMES" '
              ($names | rtrimstr("\n") | split("\n") | map(select(length > 0))) as $p
              | [$all[] | select(.name as $n | $p | index($n) != null)]
            ')
            FAILED_JSON=$(jq -c --argjson all "$SERVICES" --arg names "$FAILED_NAMES" '
              ($names | rtrimstr("\n") | split("\n") | map(select(length > 0))) as $f
              | [$all[] | select(.name as $n | $f | index($n) != null)]
            ')

            echo "passed_services<<EOF" >> $GITHUB_OUTPUT
            echo "$PASSED_JSON" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "failed_services<<EOF" >> $GITHUB_OUTPUT
            echo "$FAILED_JSON" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            exit 1
          else
            echo "⚠️  Unexpected scan result: $RESULT"
            echo ""
            echo "Services that were queued:"
            while IFS= read -r svc; do
              [ -n "$svc" ] && echo "  ⚠️  $svc"
            done <<< "$SERVICE_NAMES"
            echo "passed_services=[]" >> $GITHUB_OUTPUT
            echo "failed_services=[]" >> $GITHUB_OUTPUT
            exit 1
          fi
